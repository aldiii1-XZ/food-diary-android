name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Ambil paket
        run: flutter pub get

      - name: Analisa kode
        run: flutter analyze

      - name: Jalankan tes
        run: flutter test

      - name: Bangun APK rilis
        run: flutter build apk --release

      - name: Siapkan berkas rilis
        run: |
          mkdir -p rilis
          cp build/app/outputs/flutter-apk/app-release.apk rilis/food-diary.apk

      - name: Simpan sebagai artefak
        uses: actions/upload-artifact@v4
        with:
          name: food-diary-apk
          path: rilis/food-diary.apk

      - name: Perbarui rilis terbaru
        uses: softprops/action-gh-release@v2
        with:
          tag_name: terbaru
          name: Food Diary (versi terbaru)
          body: |
            APK siap pasang untuk Android.

            Unduh food-diary.apk di bawah, lalu buka di HP.
            Kalau muncul peringatan, izinkan "Instal dari sumber tidak dikenal".
          files: rilis/food-diary.apk
